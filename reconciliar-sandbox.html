<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conciliação Sandbox</title><style>body{background:#111b16;color:white;font:16px system-ui;padding:25px;max-width:650px;margin:auto}input,button{padding:12px;font:inherit;box-sizing:border-box;width:100%;margin:8px 0}button{background:#d3b57a;border:0;border-radius:8px;cursor:pointer}input{background:#27332b;color:white;border:1px solid #aaa;border-radius:8px}pre{overflow-wrap:anywhere;white-space:pre-wrap}</style><h1>Verificar cobrança existente</h1><p>Apenas Sandbox. Não gera nova cobrança.</p><label>Token de testes (não é enviado ao ChatGPT)<input id="token" type="password" autocomplete="off"></label><button id="check">Consultar o pagamento no Asaas</button><pre id="output" aria-live="polite"></pre><script>document.getElementById('check').onclick=async()=>{const t=document.getElementById('token'),out=document.getElementById('output');if(!t.value){out.textContent='Digite o token de testes.';return;}try{const r=await fetch('/api/reconcile-sandbox',{method:'POST',headers:{'Content-Type':'application/json','x-checkout-test-token':t.value},body:JSON.stringify({paymentId:'pay_xcv8z1rrhvv77a3l'})});const result=await r.json();out.textContent='HTTP '+r.status+'\n'+JSON.stringify(result,null,2);}catch{out.textContent='Falha de comunicação.';}finally{t.value='';}};</script></html>
